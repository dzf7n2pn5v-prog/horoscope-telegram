name: Daily horoscope to Telegram

# GitHub запускает расписание с опозданием (бывает 30+ минут), поэтому старт заранее (репозиторий публичный — минуты не лимитированы),
# а шаг «Ждём 09:00» держит отправку до ровно 06:00:00 UTC (09:00:00 по Москве).
# Второй запуск — резерв на случай, если GitHub пропустит первый. Запуски идут по очереди (concurrency),
# и резервный ничего не отправляет, если сегодня уже была успешная отправка по расписанию.
on:
  schedule:
    - cron: "53 4 * * *" # 07:53 Москва — основной
    - cron: "23 5 * * *" # 08:23 Москва — резервный
  workflow_dispatch:
    inputs:
      only_name:
        description: "Отправить только тех, чьё имя содержит эту строку (пусто — всем)"
        required: false
        default: ""
      special_shift:
        description: "Сдвиг ротации особенного гороскопа (0 — обычный вариант)"
        required: false
        default: "0"

concurrency:
  group: daily-horoscope
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Уже отправляли сегодня?
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --event schedule --status success --limit 20 \
            --json createdAt -q "[.[] | select(.createdAt >= \"$today\")] | length")
          echo "успешных отправок по расписанию сегодня: $n"
          if [ "$n" -gt 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != '1'
        with:
          node-version: "22"
      - name: Install dependencies
        if: steps.guard.outputs.skip != '1'
        run: npm install --no-audit --no-fund
      - name: Ждём 09:00 по Москве
        if: github.event_name == 'schedule' && steps.guard.outputs.skip != '1'
        run: node -e 'const t=new Date();t.setUTCHours(6,0,0,0);const ms=t-Date.now();if(ms>0){console.log("жду до 09:00:00 МСК, секунд:",Math.round(ms/1000));setTimeout(()=>console.log("09:00, отправляю"),ms)}else{console.log("запуск позже 09:00, отправляю сразу")}'
      - name: Send horoscope
        if: steps.guard.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMPLOYEES_JSON: ${{ secrets.EMPLOYEES_JSON }}
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          ONLY_NAME: ${{ github.event.inputs.only_name }}
          SPECIAL_SHIFT: ${{ github.event.inputs.special_shift }}
        run: node telegram/daily.mjs
