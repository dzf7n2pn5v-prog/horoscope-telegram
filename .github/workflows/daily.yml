name: Daily horoscope to Telegram

# Расписание 09:00 по Москве запускает Cloudflare Worker (см. worker/index.js), GitHub-расписание отключено
on:
  workflow_dispatch:
    inputs:
      only_name:
        description: "Отправить только тех, чьё имя содержит эту строку (пусто — всем)"
        required: false
        default: ""

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Send horoscope
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMPLOYEES_JSON: ${{ secrets.EMPLOYEES_JSON }}
          ONLY_NAME: ${{ github.event.inputs.only_name }}
        run: node telegram/daily.mjs
